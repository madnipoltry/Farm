 <div class="card"><b>${t('نیا شخص شامل کریں','Add a new person')}</b><br><label>${t('ای میل','Email')}</label><input id="pe" type="email"><label>${t('پاس ورڈ (کم از کم 6 حروف)','Password (min 6 characters)')}</label><input id="pw" type="text"><label>${t('کردار','Role')}</label><select id="pr">${rs('manager')}</select><button style="width:100%" onclick="addPerson()">${t('اکاؤنٹ بنائیں اور شامل کریں','Create account & add')}</button><div class="mut">${t('ای میل اور پاس ورڈ اس شخص کو خود بتا دیں۔','Give this email and password to the person yourself.')}</div></div>`;
}
function setRole(em,r){fs.collection('roles').doc(em).set({role:r})}
async function addPerson(){
 const em=$('pe').value.trim().toLowerCase(),pw=$('pw').value;
 if(!em.includes('@'))return alert(t('درست ای میل لکھیں','Enter a valid email'));

 try{
  const a2=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(FB,'sec');
  try{await a2.auth().createUserWithEmailAndPassword(em,pw)}catch(e){if(e.code!='auth/email-already-in-use')throw e}
  await a2.auth().signOut();
  await fs.collection('roles').doc(em).set({role:$('pr').value});
  $('pe').value='';$('pw').value='';alert(t('شامل ہو گیا ✓','Added ✓'));
 }catch(e){alert(AE(e))}

function backup(){

const F=()=>shed?E.filter(e=>e.shed==shed):E;

 if(!ROLE){$('nav').innerHTML='';$('m').innerHTML=`<div class="card mut">${t('لوڈ ہو رہا ہے…','Loading…')}</div>`;return}
 if(ROLE=='none'){$('nav').innerHTML='';$('m').innerHTML=`<div class="card">${t('آپ کو اس ایپ تک رسائی نہیں ملی۔ مالک سے کہیں کہ آپ کا کردار شامل کرے۔','You do not have access yet. Ask the owner to add your role.')}<br><b>${esc(ME.email)}</b></div>`;return}

}

 const x=f=>`<label>${f[1]}</label><input id="${f[0]}" ${f[2]||''}>`,nm='type="number" inputmode="numeric" min="0"';
 let f='';
 if(EGG(k))f=`<div class="grid"><div><label>${t('پیٹی','Crates')} (×360)</label><input id="pt" ${nm} oninput="eggCalc()"></div><div><label>${t('ٹرے','Trays')} (×30)</label><input id="tr" ${nm} oninput="eggCalc()"></div></div>${x(['lo',t('کھلے انڈے','Loose eggs'),nm+' oninput="eggCalc()"'])}<div class="tot" id="tot">${t('کل انڈے','Total eggs')}: 0</div>`;
 else if(k=='expense')f=x(['n',t('رقم (Rs)','Amount (Rs)'),nm])+x(['t',t('کس چیز کا خرچہ؟ (دوا، بجلی، مزدوری)','What for? (medicine, power, labour)')]);
 else if(k=='pay')f=x(['buyer',t('خریدار کا نام','Buyer name')])+x(['n',t('وصول رقم','Amount received'),nm]);
 else f=x(['n',t('تعداد','Quantity'),nm]);
 if(k=='egg_out')f+=x(['pp',t('ریٹ فی پیٹی (Rs)','Rate per crate (Rs)'),'type="number" inputmode="decimal" min="0" step="any" oninput="eggCalc()"'])+x(['buyer',t('خریدار کا نام','Buyer name')])+x(['pd',t('ابھی ادا کی گئی رقم','Paid now (Rs)'),nm]);
 if(k=='feed_in')f+=x(['c',t('کل قیمت (Rs)','Total cost (Rs)'),nm]);
 if(k=='dead')f+=x(['t',t('وجہ (بیماری، گرمی…)','Reason (disease, heat…)')]);
 else if(!['expense','pay'].includes(k))f+=x(['t',t('نوٹ (اختیاری)','Note (optional)')]);
 os(`<b style="font-size:17px">${kd(k)}</b>${f}<label>${t('تاریخ','Date')}</label><input id="d" type="date" value="${td()}">
 ${k=='pay'?'':`<label>${t('شیڈ / بیچ','Shed / batch')}</label><input id="sh" list="shl" value="${esc(shed)}"><datalist id="shl">${sheds().map(s=>`<option>${esc(s)}</option>`).join('')}</datalist>`}
 <button style="width:100%" onclick="saveE('${k}')">${t('محفوظ کریں','Save')}</button>`);
}
function saveE(k){
 const g=i=>$(i)?$(i).value.trim():'',n=EGG(k)?eggCalc():+g('n');
 if(!(n>0))return alert(t('درست مقدار لکھیں','Enter a valid quantity'));
 const o={k,n,d:g('d')||td()};['t','buyer','sh'].forEach(i=>{if(g(i))o[i=='sh'?'shed':i]=g(i)});
 ['pd','c'].forEach(i=>{if(g(i))o[i]=+g(i)});if(g('pp')){o.pp=+g('pp');o.p=o.pp/PETI}
 if(k=='pay'&&!o.buyer)return alert(t('خریدار کا نام لکھیں','Enter buyer name'));
 put('entries',o);cs();
}
function os(h){$('sc').innerHTML=h;$('sheet').style.display='flex'}function cs(){$('sheet').style.display='none'}
function bars(vals,labs,col,ttl){
 const mx=Math.max(1,...vals),w=300/vals.length;
 return `<div class="card"><b>${ttl}</b><div class="ch"><svg viewBox="0 0 300 120" width="100%">${vals.map((v,i)=>{const h=Math.max(0,v)/mx*80;return `<rect x="${i*w+2}" y="${95-h}" width="${w-4}" height="${h}" rx="2" fill="${col}"/><text x="${i*w+w/2}" y="${90-h}" font-size="7" text-anchor="middle" fill="var(--tx)">${v||''}</text><text x="${i*w+w/2}" y="110" font-size="7" text-anchor="middle" fill="var(--mut)">${labs[i]}</text>`}).join('')}</svg></div></div>`;
}
function ch(){
 const D=lastDays(14),Lb=D.map(d=>d.slice(8));
 return `<h2>${t('پچھلے 14 دن','Last 14 days')}</h2>`+bars(D.map(d=>sum('egg_in',d)),Lb,'var(--amb)',t('انڈے جمع (تعداد)','Eggs collected'))+bars(D.map(d=>sum('dead',d)),Lb,'var(--red)',t('روزانہ اموات','Daily deaths'))+bars(D.map(d=>sum('feed_out',d)),Lb,'var(--pri)',t('خوراک کے بیگ استعمال','Feed bags used'))+bars(D.map(d=>Math.round(inc(d)-cost(d))),Lb,'#3b82f6',t('روزانہ منافع (Rs)','Daily profit (Rs)'));
}
function mon(){
 const m=td().slice(0,7),mi=F().filter(e=>e.k=='egg_out'&&e.d.startsWith(m)).reduce((a,e)=>a+e.n*(+e.p||0),0);
 const fc=F().filter(e=>e.k=='feed_in'&&e.d.startsWith(m)).reduce((a,e)=>a+(+e.c||0),0),oc=F().filter(e=>e.k=='expense'&&e.d.startsWith(m)).reduce((a,e)=>a+e.n,0);
 const B=buyers();
 return `<h2>${t('اس مہینے کا حساب','This month')}</h2><div class="grid"><div class="card"><div class="k">${t('آمدنی','Income')}</div><div class="v">${Rs(mi)}</div></div><div class="card"><div class="k">${t('خوراک کا خرچہ','Feed cost')}</div><div class="v">${Rs(fc)}</div></div>
 <div class="card"><div class="k">${t('دیگر خرچے','Other expenses')}</div><div class="v">${Rs(oc)}</div></div><div class="card"><div class="k">${t('منافع','Profit')}</div><div class="v" style="color:${mi-fc-oc<0?'var(--red)':'var(--pri)'}">${Rs(mi-fc-oc)}</div></div></div>
 <button class="a" style="width:100%;margin-top:4px" onclick="addE('expense')">+ ${t('خرچہ لکھیں','Add expense')}</button>
 <h2>${t('ادھار (خریداروں کی طرف)','Credit owed by buyers')} — ${Rs(B.reduce((a,x)=>a+x[1],0))}</h2>
 ${B.map(([n,tt],i)=>`<div class="card row"><div><b>${esc(n)}</b><div style="color:var(--red)">${Rs(tt)}</div></div><button class="s" onclick="payFor(${i})">${t('وصولی','Receive')}</button></div>`).join('')||`<div class="card mut">${t('کوئی ادھار نہیں 🎉','No credit pending 🎉')}</div>`}`;
}
function payFor(i){const n=buyers()[i][0];addE('pay');$('buyer').value=n}
function vax(){
 const Lv=V.slice().sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due));
 return `<button style="width:100%;margin-bottom:8px" onclick="vaxSheet()">+ ${t('ویکسین / دوائی شامل کریں','Add vaccine / medicine')}</button>`+(Lv.map(v=>`<div class="card row" style="${v.done?'opacity:.55':''}"><div><b>${esc(v.name)}</b><div class="mut">${v.due}${v.shed?' · '+esc(v.shed):''}</div>${!v.done&&v.due<td()?`<span style="color:var(--red)">${t('تاخیر!','Overdue!')}</span>`:''}</div>
 <div style="display:flex;gap:6px">${v.done?'':`<button class="s" onclick="vdone('${v.id}')">${t('لگ گئی ✓','Done ✓')}</button>`}<button class="r" onclick="if(confirm('${t('حذف کریں؟','Delete?')}'))rm('vax','${v.id}')">✕</button></div></div>`).join('')||`<div class="card mut">${t('ابھی کوئی ویکسین درج نہیں۔','No vaccines added yet.')}</div>`);
}
function vaxSheet(){os(`<b style="font-size:17px">${t('ویکسین / دوائی','Vaccine / medicine')}</b><label>${t('نام (مثلاً رانی کھیت، گمبورو)','Name (e.g. Newcastle, Gumboro)')}</label><input id="vn"><label>${t('تاریخ','Date')}</label><input id="vd" type="date" value="${addDays(1)}"><label>${t('شیڈ (اختیاری)','Shed (optional)')}</label><input id="vs"><button style="width:100%" onclick="if(!$('vn').value.trim())return;put('vax',{name:$('vn').value.trim(),due:$('vd').value,shed:$('vs').value.trim(),done:false});cs()">${t('محفوظ کریں','Save')}</button>`)}
function vdone(id){const v=V.find(x=>x.id==id);put('vax',{...v,done:true})}
function days(){return [...new Set([td(),...F().map(e=>e.d)])].sort().reverse().slice(0,31)}
function rep(){
 const D=days(),cr=n=>(n/PETI).toFixed(1);
 return `<div class="np" style="margin:8px 0"><button class="s" onclick="try{window.print()}catch(e){}">🖨️ ${t('پرنٹ','Print')}</button> <button class="s" onclick="backup()">💾 ${t('بیک اپ','Backup')}</button></div>
 <h2>${t('روزانہ رپورٹ','Daily report')}</h2><div class="card sc"><table><tr><th>${t('تاریخ','Date')}</th><th>${t('انڈے آئے','Eggs in')}</th><th>${t('فروخت','Sold')}</th><th>${t('اسٹاک (پیٹی)','Stock (crates)')}</th><th>${t('خوراک','Feed')}</th><th>${t('اموات','Deaths')}</th><th>${t('مرغیاں','Hens')}</th><th>${t('منافع','Profit')}</th></tr>
 ${D.map(d=>`<tr><td>${d.slice(5)}</td><td>${sum('egg_in',d)}</td><td>${sum('egg_out',d)}</td><td><b>${cr(eggs(d))}</b></td><td>${sum('feed_out',d)}</td><td style="color:var(--red)">${sum('dead',d)}</td><td>${hens(d)}</td><td>${Math.round(inc(d)-cost(d))}</td></tr>`).join('')}</table></div>
 <h2 class="np">${t('تمام انٹریاں','All entries')}</h2><div class="np">${F().slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id)).slice(0,60).map(e=>`<div class="card row"><div><b>${kd(e.k)}: ${EGG(e.k)?ef(e.n)+' ('+e.n+')':e.n}</b>${e.p?` · Rs ${e.pp||Math.round(e.p*PETI*100)/100} ${t('فی پیٹی','per crate')}`:''}<div class="mut">${e.d}${e.shed?' · '+esc(e.shed):''}${e.buyer?' · '+esc(e.buyer):''}${e.t?' · '+esc(e.t):''}</div></div><button class="r" onclick="if(confirm('${t('حذف کریں؟','Delete?')}'))rm('entries','${e.id}')">✕</button></div>`).join('')||`<div class="card mut">${t('ابھی کوئی انٹری نہیں','No entries yet')}</div>`}</div>`;
}
init();
</script></body></html>
